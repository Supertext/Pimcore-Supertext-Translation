# Supertext demo: languages (read-only in Studio, defined here), the Supertext language mapping and tone.
pimcore:
    config_location:
        system_settings:
            read_target:
                type: 'symfony-config'
            write_target:
                type: 'disabled'
    general:
        valid_languages: [en, de_CH, fr_CH, it_CH]
        default_language: en
        fallback_languages: { de_CH: '', fr_CH: '', it_CH: '' }

# de_CH, fr_CH and it_CH are Supertext codes as they are; "en" needs a mapping (Supertext has no bare
# English target), here British English. The source is sent as "en" either way.
supertext_translation:
    languages:
        en: { code: en-GB }
        de_CH: { politeness: more }
        fr_CH: { politeness: more }
        it_CH: { politeness: more }
