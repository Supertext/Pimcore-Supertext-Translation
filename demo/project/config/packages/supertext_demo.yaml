# Supertext demo: languages (read-only in Studio, defined here).
pimcore:
    config_location:
        system_settings:
            read_target:
                type: 'symfony-config'
            write_target:
                type: 'disabled'
    general:
        valid_languages: [en, de_CH, fr_CH, it_CH]
        default_language: en
        fallback_languages: { de_CH: '', fr_CH: '', it_CH: '' }

# The Supertext language mapping (en → en-GB, the Swiss languages formal) is saved on the
# Supertext → Settings screen by supertext:demo-setup, so the screen shows it (not overridden here).
