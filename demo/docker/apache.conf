<VirtualHost *:8080>
    DocumentRoot /app/demo/project/public
    <Directory /app/demo/project/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    # Pimcore's generated thumbnails and static files are served directly; everything else goes to Symfony.
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{REQUEST_URI} !^/\.well-known/mercure
    RewriteRule ^ /index.php [L]

    ProxyPreserveHost On
    ProxyPass /.well-known/mercure http://127.0.0.1:3000/.well-known/mercure flushpackets=on timeout=3600
    ProxyPassReverse /.well-known/mercure http://127.0.0.1:3000/.well-known/mercure

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
