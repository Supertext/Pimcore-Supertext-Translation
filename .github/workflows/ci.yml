name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: phpunit:11
      - name: Lint
        run: find src tests demo/project/src -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer, phpstan:2.3
          coverage: none
      - name: Install Pimcore (PHPStan needs its classes)
        run: composer install --no-dev --no-scripts --no-plugins --ignore-platform-reqs --no-interaction --no-progress --prefer-dist
      - name: PHPStan
        run: phpstan analyse --no-progress --memory-limit=2G --error-format=github

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/package-lock.json
      - run: npm ci
      - run: npm run check-types
      - run: npm run build

  demo:
    runs-on: ubuntu-latest
    # Pimcore 2026 only boots with a registered product key (repository secrets).
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 5s --health-timeout 5s --health-retries 20
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
    steps:
      - name: Product key available?
        id: key
        env:
          KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
        run: if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "No PIMCORE_PRODUCT_KEY secret; skipping the demo check."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.ok == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Build the demo image
        if: steps.key.outputs.ok == 'true'
        run: docker build -f demo/Dockerfile -t supertext-pimcore-demo .
      - name: Start the stand-in API
        if: steps.key.outputs.ok == 'true'
        run: node tests/docs/stand-in.mjs > stand-in.log 2>&1 &
      - name: Start the demo twice, check the accounts, translate the samples
        if: steps.key.outputs.ok == 'true'
        env:
          MYSQL_URL: mysql://root:root@127.0.0.1:3306/railway
          PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
          PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
        run: tests/demo-check.sh
      - if: failure()
        run: docker logs demo 2>&1 | tail -150; cat stand-in.log
