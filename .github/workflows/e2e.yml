name: E2E

# The demo image is built once and started twice (MySQL and OpenSearch as services):
# 1. against the REAL Supertext API (secret SUPERTEXT_API_KEY): language list check and the
#    end-to-end test (tests/e2e), so language mapping and the live API's behaviour are tested;
# 2. against the stand-in API (tests/docs): the docs screenshots, so the images don't change
#    with every machine translation. Changed images become a pull request.
# Pimcore 2026 only starts with a registered product key (secrets PIMCORE_ENCRYPTION_SECRET,
# PIMCORE_INSTANCE_IDENTIFIER, PIMCORE_PRODUCT_KEY); without them the whole run is skipped.
# See "End-to-end tests" and "Docs screenshots" in docs/DEVELOPER.md.

on:
  workflow_dispatch:
  # A pull request that changes the E2E test itself runs it before merging.
  pull_request:
    paths:
      - 'tests/e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '45 5 * * 1' # Mondays, 05:45 UTC
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'config/**'
      - 'public/**'
      - 'translations/**'
      - 'assets/**'
      - 'composer.json'
      - 'demo/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E (live API) and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      images-changed: ${{ steps.images.outputs.changed }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      opensearch:
        image: opensearchproject/opensearch:2.19.6
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ['9200:9200']
    env:
      LIVE_URL: http://127.0.0.1:8081
      DOCS_URL: http://127.0.0.1:8082
      # The demo's own database on the MySQL service is PIMCORE_DB_NAME (one per start).
      MYSQL_URL: mysql://root:root@127.0.0.1:3306/mysql
      PIMCORE_DB_SERVER_VERSION: 8.0.0
      PIMCORE_OPENSEARCH_DSN: opensearch://127.0.0.1:9200?ssl=false
    steps:
      - name: Check for the Pimcore product key
        id: pimcore
        env:
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
        run: |
          if [ -n "$PIMCORE_PRODUCT_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret PIMCORE_PRODUCT_KEY is not set: Pimcore 2026 can't start, skipping the E2E run (see docs/DEVELOPER.md → Pimcore product key)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pimcore.outputs.present == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pimcore.outputs.present == 'true'
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.pimcore.outputs.present == 'true'

      - name: Build the demo image (cached between runs)
        if: steps.pimcore.outputs.present == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          tags: supertext-pimcore-demo
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Demo accounts and secrets for this run only
        if: steps.pimcore.outputs.present == 'true'
        run: |
          for v in DEMO_ADMIN_PASSWORD DEMO_EDITOR_PASSWORD APPLICATION_SECRET MERCURE_JWT_KEY; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::$value"
            echo "$v=$value" >> "$GITHUB_ENV"
          done
          {
            echo "DEMO_ADMIN_EMAIL=admin@e2e.example.com"
            echo "DEMO_EDITOR_EMAIL=editor@e2e.example.com"
          } >> "$GITHUB_ENV"

      - name: Install the test tools
        if: steps.pimcore.outputs.present == 'true'
        run: |
          (cd tests/e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
          (cd tests/docs && npm ci --no-audit --no-fund && npx playwright install chromium)

      # --- 1. Real Supertext API ----------------------------------------------------------
      - name: Check for the API key
        id: key
        if: steps.pimcore.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
        run: |
          if [ -n "$SUPERTEXT_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret SUPERTEXT_API_KEY is not set: skipping the tests against the real Supertext API (see docs/DEVELOPER.md → End-to-end tests)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start the demo against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
          PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
          PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
        run: |
          # Version reports off: CI runs are no installations for the Commando Center.
          docker run -d --name demo-live --network host \
            -e PORT=8081 -e PUBLIC_URL="$LIVE_URL" -e PIMCORE_DB_NAME=pimcore_live \
            -e MYSQL_URL -e PIMCORE_DB_SERVER_VERSION -e PIMCORE_OPENSEARCH_DSN \
            -e APPLICATION_SECRET -e MERCURE_JWT_KEY \
            -e PIMCORE_ENCRYPTION_SECRET -e PIMCORE_INSTANCE_IDENTIFIER -e PIMCORE_PRODUCT_KEY \
            -e SUPERTEXT_API_KEY -e SUPERTEXT_VERSION_REPORTS=0 \
            -e DEMO_ADMIN_EMAIL -e DEMO_ADMIN_PASSWORD -e DEMO_EDITOR_EMAIL -e DEMO_EDITOR_PASSWORD \
            supertext-pimcore-demo
          timeout 900 sh -c "until curl -sf -o /dev/null $LIVE_URL/pimcore-studio/; do sleep 5; done" || { docker logs demo-live; exit 1; }
          docker logs demo-live 2>&1 | grep '\[demo\]' || true

      - name: Language list against the real API
        if: steps.key.outputs.present == 'true'
        env:
          SUPERTEXT_API_KEY: ${{ secrets.SUPERTEXT_API_KEY }}
          E2E_SOURCE: en
          E2E_TARGETS: de-CH,fr-CH,it-CH
        run: |
          node tests/e2e/features.mjs

      - name: End-to-end test against the real API
        if: steps.key.outputs.present == 'true'
        working-directory: tests/e2e
        env:
          STUDIO_URL: ${{ env.LIVE_URL }}
          DEMO_CONTAINER: demo-live
          EDITOR_EMAIL: ${{ env.DEMO_EDITOR_EMAIL }}
          EDITOR_PASSWORD: ${{ env.DEMO_EDITOR_PASSWORD }}
        run: node live.mjs

      # --- 2. Docs screenshots against the stand-in ----------------------------------------
      - name: Screenshots against the stand-in API
        if: steps.pimcore.outputs.present == 'true' && (success() || failure())
        env:
          PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
          PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
        run: |
          # One demo at a time: both use the Mercure port 3000 and the same OpenSearch index
          # names, so the live demo stops and its search index is dropped first.
          docker stop demo-live > /dev/null 2>&1 || true
          curl -sf -X DELETE 'http://127.0.0.1:9200/_all' > /dev/null || true
          (cd tests/docs && nohup node stand-in.mjs > stand-in.log 2>&1 &)
          docker run -d --name demo-docs --network host \
            -e PORT=8082 -e PUBLIC_URL="$DOCS_URL" -e PIMCORE_DB_NAME=pimcore_docs \
            -e MYSQL_URL -e PIMCORE_DB_SERVER_VERSION -e PIMCORE_OPENSEARCH_DSN \
            -e APPLICATION_SECRET -e MERCURE_JWT_KEY \
            -e PIMCORE_ENCRYPTION_SECRET -e PIMCORE_INSTANCE_IDENTIFIER -e PIMCORE_PRODUCT_KEY \
            -e SUPERTEXT_API_KEY=stand-in -e SUPERTEXT_API_URL=http://127.0.0.1:8765/v1/ \
            -e SUPERTEXT_REPORT_URL=http://127.0.0.1:8765/report \
            -e DEMO_ADMIN_EMAIL -e DEMO_ADMIN_PASSWORD -e DEMO_EDITOR_EMAIL -e DEMO_EDITOR_PASSWORD \
            supertext-pimcore-demo
          timeout 900 sh -c "until curl -sf -o /dev/null $DOCS_URL/pimcore-studio/; do sleep 5; done" || { docker logs demo-docs; exit 1; }
          cd tests/docs
          BASE_URL="$DOCS_URL" node screenshots.mjs

      - name: Did the screenshots change?
        id: images
        if: steps.pimcore.outputs.present == 'true' && (success() || failure())
        run: |
          if [ -n "$(git status --porcelain docs/images)" ]; then
            git status --short docs/images
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the screenshots
        if: steps.images.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-images
          path: docs/images/

      - name: Collect logs for debugging
        if: failure()
        run: |
          mkdir -p e2e-debug
          cp -r tests/e2e/artifacts e2e-debug/ 2>/dev/null || true
          cp tests/docs/stand-in.log e2e-debug/ 2>/dev/null || true
          for c in demo-live demo-docs; do
            docker logs "$c" > "e2e-debug/$c.log" 2>&1 || true
            docker cp "$c:/app/demo/project/var/log" "e2e-debug/$c-var-log" > /dev/null 2>&1 || true
            for f in install worker index; do docker cp "$c:/tmp/$f.log" "e2e-debug/$c-$f.log" > /dev/null 2>&1 || true; done
          done

      - name: Upload logs for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-debug
          path: e2e-debug/
          retention-days: 7

  screenshots-pr:
    name: Pull request with new screenshots
    needs: e2e
    if: needs.e2e.outputs.images-changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-images
          path: docs/images/

      - name: Push a branch and open (or update) the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch=automation/docs-screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add docs/images
          git commit -m "Docs: regenerate screenshots" -m "Made by the E2E workflow: $RUN_URL"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$branch"
          if [ -z "$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$REPO" --head "$branch" --base main \
              --title "Docs: regenerate screenshots" \
              --body "The E2E workflow took new screenshots of the demo (against the stand-in API) and they differ from \`docs/images/\`. Check that the changes are intended before merging. Run: $RUN_URL"
          fi
